# Render Blueprint：在 Render 建立這個 repo 時會自動讀取。
# 到 https://render.com → New → Blueprint → 連這個 GitHub repo 即可。
services:
  - type: web
    name: meeting-agent
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    autoDeploy: true   # 每次 push 到 GitHub 自動重新部署
    envVars:
      # 金鑰不放進 repo；部署後在 Render 後台手動填（Environment 分頁）
      - key: GEMINI_API_KEY
        sync: false
      # 分析模型：免費層 gemini-3.5-flash 每天每專案僅 20 次且常過載，
      # 暫用額度高又穩定的 lite 版；配額充足或升級付費後可改回 gemini-3.5-flash 提高品質
      - key: GEMINI_MODEL
        value: gemini-flash-lite-latest
      - key: TRANSCRIBE_ENGINE
        value: gemini
      # 轉錄專用模型：吃掉絕大多數請求，用免費額度高的輕量版
      - key: TRANSCRIBE_MODEL
        value: gemini-flash-lite-latest
      # 長檔（>10 分）整份單次轉錄用的強模型：講者分辨比 lite 分段好。
      # 用釘死版本 gemini-3.5-flash，不用會飄到過載版本（503）的 -latest 別名。
      # 給很多人同時傳長檔、想更省額度時，改設 TRANSCRIBE_LONG_FILE_THRESHOLD_SECONDS=0
      # 讓長檔也走 lite 分段即可。
      - key: TRANSCRIBE_FALLBACK_MODEL
        value: gemini-3.5-flash
      # 選填：貼上 Firebase service account JSON 即改用 Firestore 永久保存資料；
      # 留空則用本地 JSON（重啟會清空）
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
      # 共用鑰匙。generateValue＝Render 自己產一串隨機值，所以新部署一開始
      # 就是鎖上的：忘記填 ≠ 全世界都能讀寫刪除你的會議資料。
      # 要登入時到 Render 後台 Environment 分頁把值複製出來（首次開啟網站
      # 會跳輸入框）。已經手動填過的不受影響——這個變數已存在就不會被覆蓋。
      # 若改用下面的 Google 登入，這把共用鑰匙就會被登入取代（不再生效）。
      - key: API_TOKEN
        generateValue: true
      # Google 登入（選填，但要給別人試用就該開）：填了這三個就啟用帳號制，
      # 每個人只看得到自己的會議與任務。值在 Firebase Console →
      # 專案設定 → 一般設定 → 你的應用程式；都是公開值。
      # 啟用時 FIREBASE_CREDENTIALS_JSON 也必須一起填（驗 ID token 要用），
      # 少了會直接啟動失敗，不會悄悄退回單人模式。
      - key: FIREBASE_WEB_API_KEY
        sync: false
      - key: FIREBASE_AUTH_DOMAIN
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
