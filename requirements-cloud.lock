# 雲端部署實際安裝的完整版本鎖定（Dockerfile 與 CI 都裝這份）。
#
# 為什麼要鎖：requirements-cloud.txt 全用 >=，每次 Render 重新建置都會裝到當下
# 最新版——哪天 starlette／google-genai 出了不相容的大版本，部署會突然壞掉，
# 本機卻一切正常。鎖住之後「CI 測過的版本＝Render 裝的版本」。
#
# 版本依 Render 的環境（Linux x86_64、CPython 3.12）解析，並對齊開發機實測通過的版本。
# 升級方式：改 requirements-cloud.txt → 在開發機裝好新版跑過 pytest → 重新產生本檔：
#   python -m pip install --dry-run --ignore-installed --report report.json #     --platform manylinux_2_28_x86_64 --platform manylinux2014_x86_64 #     --implementation cp --python-version 3.12 --only-binary=:all: --target _tmp #     -r requirements-cloud.txt -c <開發機 pip freeze 的版本>
#   再把 report.json 的 install 清單寫成 名稱==版本
#
# uvloop 手動補上：它是 uvicorn[standard] 只在 Linux 才裝的依賴（平台條件在 Windows 上
# 解析時會被略過），Render 原本就有裝，鎖定後不能少
