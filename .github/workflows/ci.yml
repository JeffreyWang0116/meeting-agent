# 每次 push / PR 自動跑完整測試（不需要 GPU：Whisper 與 Gemini 都以假物件注入）
name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          # 與 Dockerfile 裝同一份鎖定版本：CI 綠燈才代表 Render 部署的那組版本能跑
          pip install -r requirements-cloud.lock
          pip install pytest httpx ruff
      # 規則見 ruff.toml：只挑會抓到真 bug 的，不管風格與行長
      - name: Lint
        run: ruff check .
      - name: Run tests
        run: pytest -q
