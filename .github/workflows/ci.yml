# 每次 push / PR 自動跑完整測試（不需要 API 金鑰：Gemini 與 pyannote 都以假物件注入）
name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # 匯出 PDF 要有中文字型可以內嵌，而且要與 Dockerfile 裝的是同一份：
      # 少了它 PDF 的版面完全正確但每個字都是別的字，那正是 test_docexport
      # 要擋的事——在沒有字型的 runner 上跳過等於沒有擋
      - name: Install CJK font
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-arphic-uming
      - name: Install dependencies
        run: |
          # 與 Dockerfile 裝同一份鎖定版本：CI 綠燈才代表 Render 部署的那組版本能跑
          pip install -r requirements-cloud.lock
          # pypdf 只有測試用得到（把產出的 PDF 讀回來比對中文），不進雲端映像
          pip install pytest httpx ruff pypdf
      # 規則見 ruff.toml：只挑會抓到真 bug 的，不管風格與行長
      - name: Lint
        run: ruff check .
      - name: Run tests
        run: pytest -q
